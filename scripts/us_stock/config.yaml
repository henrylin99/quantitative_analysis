# 数据获取配置
fetch:
  # 历史数据周期 (yfinance period 格式)
  history_period: "2y"
  batch_size: 20       # 每批20只股票
  batch_delay: 2.0     # 批次间隔秒数
  max_retries: 2       # 每批最大重试次数
  retry_delay: 2.0     # 重试间隔秒数
  request_timeout: 30  # 单次请求超时秒数

# 财务数据配置
financials:
  enabled: true
