# 数据获取配置
fetch:
  # 历史数据周期 (yfinance period 格式: 1d, 5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, 10y, ytd, max)
  history_period: "2y"
  # 批量下载配置
  batch_size: 20       # 每批20只股票
  batch_delay: 2.0     # 批次间隔秒数
  # 重试配置
  max_retries: 2       # 每批最大重试次数
  retry_delay: 2.0     # 重试间隔秒数
  # 超时配置
  request_timeout: 30  # 单次请求超时秒数

# 财务数据配置
financials:
  enabled: true
