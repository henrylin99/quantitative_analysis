services:
  web:
    build: .
    environment:
      - DATA_DIR=/app/data
      - SQLITE_DATABASE_PATH=/app/instance/stock_cursor.sqlite3
      - FLASK_ENV=production
      - SOCKETIO_ASYNC_MODE=eventlet
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./instance:/app/instance
    restart: unless-stopped
